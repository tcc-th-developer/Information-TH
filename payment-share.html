<style>
  :root {
    --gold:   #f0b90b;
    --gold-d: #d4a017;
    --green:  #03c075;
    --red:    #f6465d;
    --dark1:  #0b0e13;
    --dark2:  #111620;
    --dark3:  #161c27;
    --dark4:  #1c2333;
    --border: rgba(255,255,255,0.08);
    --border2:rgba(255,255,255,0.06);
    --text:   #e2e8f0;
    --muted:  #64748b;
    --black:  #0a0c10;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--dark1);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 0;
    /* subtle grid bg */
    background-image:
      linear-gradient(rgba(240,185,11,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240,185,11,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* ── Top Banner ── */
  .top-banner {
    width: 100%;
    background: linear-gradient(135deg, #0f1318 0%, #131820 100%);
    border-bottom: 1px solid rgba(240,185,11,0.15);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .top-banner-brand {
    display: flex; align-items: center; gap: 10px;
  }
  .top-banner-brand img { height: 28px; }
  .top-banner-brand-text {
    font-family: 'Orbitron', monospace;
    font-size: 0.72rem;
    color: var(--gold);
    letter-spacing: 2px;
  }
  .top-banner-badge {
    font-size: 0.65rem;
    color: var(--muted);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 12px;
    letter-spacing: 1px;
  }

  /* ── Loading / Error ── */
  #loading-screen, #error-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60vh; gap: 16px; text-align: center; padding: 20px;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 3px solid rgba(240,185,11,0.15);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    color: var(--muted); font-size: 0.85rem; letter-spacing: 1px;
  }
  .error-icon { font-size: 3rem; }
  .error-title { color: var(--red); font-size: 1.1rem; font-weight: 700; }
  .error-msg { color: var(--muted); font-size: 0.82rem; max-width: 320px; line-height: 1.6; }

  /* ── Card Container ── */
  #payment-container {
    width: 100%;
    max-width: 560px;
    padding: 20px 16px 40px;
    animation: fadeUp 0.5s ease both;
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(20px); }
    to   { opacity:1; transform: translateY(0);    }
  }

  /* ── Card ── */
  .card {
    background: linear-gradient(160deg, #131820, #0f1318);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.6), 0 0 1px rgba(240,185,11,0.1) inset;
  }

  /* Header */
  .card-header {
    background: linear-gradient(135deg, #1a1f28, #0f1318);
    padding: 14px 18px;
    border-bottom: 1px solid var(--border2);
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .card-header-left { display: flex; align-items: center; gap: 10px; }
  .card-header-left img { height: 26px; }
  .report-label {
    font-family: 'Orbitron', monospace; font-size: 0.75rem;
    color: var(--gold); letter-spacing: 2px;
  }
  .live-row {
    display: flex; align-items: center; gap: 6px; margin-top: 3px;
  }
  .pulse-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink {
    0%,100%{ opacity:1; } 50%{ opacity:0.3; }
  }
  .live-text { font-size: 0.65rem; color: var(--green); }
  .live-date { font-size: 0.65rem; color: var(--muted); }
  .report-no {
    font-size: 0.65rem; color: var(--gold);
    border: 1px solid rgba(240,185,11,0.3);
    padding: 4px 12px; border-radius: 20px;
    flex-shrink: 0;
  }

  /* Body */
  .card-body { padding: 16px 18px; }

  /* Member block */
  .member-block {
    display: flex; align-items: center; gap: 14px;
    background: rgba(240,185,11,0.04);
    border: 1px solid var(--border2); border-radius: 12px;
    padding: 12px; margin-bottom: 14px;
  }
  .member-avatar {
    width: 50px; height: 50px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--gold), var(--gold-d));
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
  }
  .member-name { font-size: 1.05rem; font-weight: 700; }
  .member-meta { display: flex; gap: 12px; margin-top: 4px; flex-wrap: wrap; }
  .member-meta span { font-size: 0.72rem; color: var(--muted); }
  .member-meta b { color: var(--gold); }
  .member-comm { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
  .member-comm b { color: var(--gold); }
  .badge {
    font-size: 0.68rem; font-weight: 700; padding: 4px 10px;
    border-radius: 20px; align-self: flex-start; flex-shrink: 0;
    border: 1px solid;
  }
  .badge-approve { color: var(--green); border-color: rgba(3,192,117,0.35); background: rgba(3,192,117,0.1); }
  .badge-pending { color: var(--gold);  border-color: rgba(240,185,11,0.35); background: rgba(240,185,11,0.1); }

  /* Level boxes */
  .level-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .level-box {
    border-radius: 10px; padding: 12px;
  }
  .level-box.lva { background: rgba(3,192,117,0.08); border: 1px solid rgba(3,192,117,0.2); }
  .level-box.lvb { background: rgba(240,185,11,0.08); border: 1px solid rgba(240,185,11,0.2); }
  .level-lbl { font-size: 0.62rem; color: var(--muted); }
  .level-val {
    font-weight: 700; font-size: 1.1rem; margin-top: 4px;
  }
  .lva .level-val { color: var(--green); }
  .lvb .level-val { color: var(--gold); }
  .level-sub { font-size: 0.62rem; color: var(--muted); margin-top: 2px; }

  /* Summary 3 boxes */
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .summary-box {
    background: var(--dark2); border: 1px solid var(--border2);
    border-radius: 10px; padding: 10px; text-align: center;
  }
  .summary-box.highlight {
    background: linear-gradient(135deg,rgba(240,185,11,0.15),rgba(240,185,11,0.05));
    border-color: rgba(240,185,11,0.3);
  }
  .summary-lbl { font-size: 0.58rem; color: var(--muted); line-height: 1.4; }
  .summary-val { font-size: 1rem; font-weight: 700; margin-top: 4px; }
  .col-green { color: var(--green); }
  .col-gold  { color: var(--gold);  }

  /* Detail 2-col grid */
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .detail-section-title {
    font-size: 0.72rem; color: var(--gold); font-weight: 600; margin-bottom: 8px;
  }
  .detail-inner {
    background: var(--dark2); border-radius: 10px; padding: 12px;
  }
  .detail-row {
    display: flex; justify-content: space-between;
    padding: 5px 0; font-size: 0.78rem;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row span:first-child { color: var(--muted); }
  .detail-total {
    display: flex; justify-content: space-between;
    padding: 8px 0 0; font-size: 0.82rem; font-weight: 700;
  }
  .detail-total span:last-child { color: var(--gold); }

  /* Amount box */
  .amount-box {
    background: linear-gradient(135deg, var(--gold), var(--gold-d));
    border-radius: 12px; padding: 14px; text-align: center; margin-top: 8px;
  }
  .amount-lbl { font-size: 0.65rem; color: rgba(0,0,0,0.6); font-weight: 600; letter-spacing: 1px; }
  .amount-val {
    font-family: 'Orbitron', monospace; font-size: 1.5rem;
    font-weight: 900; color: var(--black); margin-top: 4px;
  }

  /* Trade history */
  .trade-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px;
  }
  .trade-card {
    background: var(--dark2); border: 1px solid var(--border2);
    border-radius: 10px; padding: 10px 8px; text-align: center;
    position: relative; overflow: hidden;
  }
  .trade-card::before {
    content:''; position:absolute; top:0;left:0;right:0; height:2px;
    background: linear-gradient(90deg, var(--gold), var(--gold-d));
  }
  .trade-no  { font-size: 0.58rem; color: var(--muted); margin-bottom: 2px; }
  .trade-coin{ font-size: 0.7rem;  color: var(--gold);  font-weight: 700; margin-bottom: 4px; }
  .trade-amt { font-size: 0.9rem;  font-weight: 700;    color: var(--green); }
  .trade-amt.neg { color: var(--red); }
  .trade-card.neg::before { background: linear-gradient(90deg, var(--red), #b3243a); }
  .pay-notice { background: rgba(240,185,11,.08); border: 1px solid rgba(240,185,11,.45); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; text-align: center; }
  .pay-notice-t { font-size: .78rem; color: var(--gold); font-weight: 700; line-height: 1.5; }
  .pay-notice-w { font-family: monospace; font-size: .85rem; color: #fff; margin-top: 4px; letter-spacing: .5px; }
  .pay-notice-s { font-size: .62rem; color: var(--muted); margin-top: 3px; }

  /* Wallet / QR */
  .qr-section { margin-bottom: 14px; }
  .qr-section-title { font-size: 0.72rem; color: var(--gold); font-weight: 600; margin-bottom: 8px; }
  .qr-img-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
  .qr-img { width: 150px; height: 150px; border-radius: 12px; border: 2px solid var(--border); object-fit: contain; background: #fff; }
  .wallet-box {
    display: flex; align-items: center; gap: 8px;
    background: rgba(240,185,11,0.04); border: 1px solid rgba(240,185,11,0.15);
    border-radius: 8px; padding: 8px 12px; margin-bottom: 6px;
  }
  .wallet-addr {
    font-family: monospace; font-size: 0.75rem; color: var(--gold);
    word-break: break-all; flex: 1;
  }
  .copy-btn {
    background: rgba(240,185,11,0.12); border: 1px solid var(--gold);
    color: var(--gold); padding: 4px 10px; border-radius: 6px;
    cursor: pointer; font-size: 0.7rem; white-space: nowrap;
    font-family: 'Rajdhani', sans-serif; font-weight: 600;
    transition: background 0.15s;
  }
  .copy-btn:hover { background: rgba(240,185,11,0.25); }
  .wallet-chain { font-size: 0.65rem; color: var(--green); text-align: center; }
  .wallet-hint  { font-size: 0.62rem; color: var(--muted); text-align: center; margin-top: 3px; }

  /* Status bar */
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; background: var(--dark2);
    border-radius: 8px; margin-bottom: 14px;
  }
  .status-text { font-weight: 600; }
  .status-date { font-size: 0.75rem; color: var(--muted); }

  /* Footer */
  .card-footer {
    text-align: center; padding: 12px 0 0;
    border-top: 1px solid var(--border2);
    margin-top: 4px;
  }
  .footer-brand {
    font-family: 'Orbitron', monospace; font-size: 0.62rem;
    color: var(--muted); letter-spacing: 2px;
  }
  .footer-secure { font-size: 0.6rem; color: var(--green); margin-top: 3px; }

  /* Section title */
  .section-title {
    font-size: 0.72rem; color: var(--gold); font-weight: 600;
    margin-bottom: 10px; margin-top: 14px;
  }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(3,192,117,0.92); color: #fff;
    padding: 8px 20px; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
    opacity: 0; transition: all 0.3s ease; pointer-events: none; z-index: 9999;
    white-space: nowrap;
  }
  #toast.show { opacity:1; transform: translateX(-50%) translateY(0); }

  /* Responsive */
  @media(max-width:500px){
    .detail-grid { grid-template-columns: 1fr; }
    .summary-grid { grid-template-columns: 1fr 1fr 1fr; }
    .level-val { font-size: 0.95rem; }
  }
  @media(max-width:360px){
    .summary-grid { grid-template-columns: 1fr 1fr; }
    .summary-grid .highlight { grid-column: span 2; }
  }

  .top-banner-right { display:flex; align-items:center; gap:8px; min-width:0; flex:1; justify-content:flex-end; }
  .top-banner-badge { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .wallet-click { cursor:pointer; margin-top:4px; }
  .wallet-click:hover { color: var(--gold); }

  /* ── ปุ่ม/เมนูเลือกภาษา (เหมือนไฟล์หลัก) ── */
  .lang-btn{flex-shrink:0;height:28px;padding:0 10px;border-radius:14px;cursor:pointer;white-space:nowrap;
    background:rgba(240,185,11,.1);color:var(--gold);border:1px solid rgba(240,185,11,.28);
    font:600 .72rem 'Rajdhani',sans-serif;letter-spacing:.5px;transition:background .2s;}
  .lang-btn:hover{background:rgba(240,185,11,.2);}
  #tcc-lang-menu{display:none;position:fixed;top:54px;right:10px;z-index:400;min-width:150px;
    background:#131820;border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.6);}
  #tcc-lang-menu.open{display:block;}
  #tcc-lang-menu button{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;
    background:none;border:none;color:var(--text);padding:9px 12px;border-radius:8px;cursor:pointer;font-size:.85rem;text-align:left;font-family:'Rajdhani',sans-serif;}
  #tcc-lang-menu button:hover{background:rgba(240,185,11,.1);}
  #tcc-lang-menu button.on{color:var(--gold);font-weight:700;}
</style>
</head>

<!-- ═══ TCC i18n — 9 ภาษา (th en vi kh mm la ms id zh) · โครงสร้างเดียวกับ index_L_Main (ใช้ key pd.* ชุดเดียวกัน) ═══ -->
<script id="tcc-i18n">
/* =====================================================================
   TCC i18n — โครงสร้างภาษา (เหมือนไฟล์หลัก index_L_Main)
   ลำดับภาษา (ห้ามสลับ): th en vi kh mm la ms id zh   ·   key → [th, en, vi, kh, mm, la, ms, id, zh]
   วิธีใช้
     • JS        : tccT('pd.copy')  ·  tccT('pd.tradeN',{n:3}) แทน {n} ในข้อความ
     • HTML      : data-i18n="key" (ข้อความ) · data-i18n-ph="key" (placeholder) · data-i18n-title="key" (title)
     • เพิ่มคำ   : Object.assign(TCC_I18N, { 'page.key': [th,en,vi,kh,mm,la,ms,id,zh] })  แล้วเรียก tccI18nCheck() ต้องได้ []
     • หน้าที่วาดเอง : ฟัง document.addEventListener('tcc-lang', e => render())  (e.detail.lang)
   ภาษา: จำใน localStorage "tcc_lang" (+ ?lang=xx ใน URL) — ใช้ร่วมกับหน้าหลัก
   คีย์ pd.* / pay.status.* / common.* / lang.* คัดลอกจากไฟล์หลักตรงตัว · คีย์ ps.* เป็นของหน้า payment-share เท่านั้น
   ===================================================================== */
(function(){
  var LANGS=['th','en','vi','kh','mm','la','ms','id','zh'], IDX={th:0,en:1,vi:2,kh:3,mm:4,la:5,ms:6,id:7,zh:8};
  var HTML_LANG={th:'th',en:'en',vi:'vi',kh:'km',mm:'my',la:'lo',ms:'ms',id:'id',zh:'zh-CN'};

    "ps.expires": ["ลิงก์นี้หมดอายุ {d}","This link expires {d}","Liên kết này hết hạn {d}","តំណនេះផុតកំណត់ {d}","ဤလင့်ခ် သက်တမ်းကုန်ချိန် {d}","ລິ້ງນີ້ໝົດອາຍຸ {d}","Pautan ini tamat tempoh pada {d}","Tautan ini kedaluwarsa pada {d}","此链接将于 {d} 过期"],

  // ── เลือกภาษาเริ่มต้น: ?lang=xx > ค่าที่จำไว้ > th ──
  (function(){
    var q=''; try{ q=(new URLSearchParams(location.search).get('lang')||'').toLowerCase(); }catch(e){}
    var s=lsGet(KEY);
    if(has(q)){ cur=q; lsSet(KEY,q); } else if(has(s)){ cur=s; }
  })();

  function tccT(k,v){
    var a=D[k], s=a?(a[IDX[cur]]||a[1]||a[0]):k;
    if(v) s=String(s).replace(/\{(\w+)\}/g,function(m,n){return v[n]!=null?v[n]:m;});
    return s;
  }

  function tccApplyI18n(){
    var de=document.documentElement; de.lang=HTML_LANG[cur]; de.setAttribute('data-lang',cur);
    qa('[data-i18n]').forEach(function(e){ e.textContent=tccT(e.getAttribute('data-i18n')); });
    qa('[data-i18n-ph]').forEach(function(e){ e.placeholder=tccT(e.getAttribute('data-i18n-ph')); });
    qa('[data-i18n-title]').forEach(function(e){ e.title=tccT(e.getAttribute('data-i18n-title')); });
    var lb=$('langBtnMain'); if(lb){ lb.textContent='🌐 '+cur.toUpperCase(); lb.title=tccT('lang.title'); }
    qa('#tcc-lang-menu button').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-l')===cur); });
  }

  function tccSetLang(l){
    if(!has(l)||l===cur) return;
    cur=l; lsSet(KEY,l); lsSet(CHAT_KEY,l);
    tccApplyI18n();
    try{ document.dispatchEvent(new CustomEvent('tcc-lang',{detail:{lang:l}})); }catch(e){}
  }

  // ── ปุ่ม/เมนูเลือกภาษา ──
  function buildMenu(){
    var m=document.createElement('div'); m.id='tcc-lang-menu';
    m.innerHTML=LANGS.map(function(l){ return '<button type="button" data-l="'+l+'"><span>'+NATIVE[l]+'</span><b>'+l.toUpperCase()+'</b></button>'; }).join('');
    m.addEventListener('click',function(ev){
      var b=ev.target.closest('button[data-l]'); if(!b) return;
      m.classList.remove('open'); tccSetLang(b.getAttribute('data-l'));
    });
    document.body.appendChild(m);
    document.addEventListener('click',function(ev){ if(!ev.target.closest('#tcc-lang-menu,#langBtnMain')) m.classList.remove('open'); });
    document.addEventListener('keydown',function(ev){ if(ev.key==='Escape') m.classList.remove('open'); });
    return m;
  }
  function init(){
    var menu=buildMenu(), btn=$('langBtnMain');
    if(btn) btn.addEventListener('click',function(){ menu.classList.toggle('open'); });
    tccApplyI18n();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();

  // ── ตัวตรวจ (เหมือนไฟล์หลัก): ต้องได้ [] ──
  function tccI18nCheck(){
    var errs=[], ph=function(s){return (String(s).match(/\{\w+\}/g)||[]).sort().join();};
    Object.keys(D).forEach(function(k){
      var a=D[k];
      if(!Array.isArray(a)||a.length!==LANGS.length){ errs.push(k+': ต้องมี '+LANGS.length+' ค่า ('+LANGS.join(' ')+')'); return; }
      a.forEach(function(s,i){
        if(!String(s==null?'':s).trim()) errs.push(k+': ขาดภาษา '+LANGS[i]);
        else if(ph(s)!==ph(a[0])) errs.push(k+': ตัวแปร {} ภาษา '+LANGS[i]+' ไม่ตรงกับฉบับไทย');
      });
    });
    qa('[data-i18n],[data-i18n-ph],[data-i18n-title]').forEach(function(e){
      ['data-i18n','data-i18n-ph','data-i18n-title'].forEach(function(at){
        var k=e.getAttribute(at); if(k&&!D[k]) errs.push('HTML '+at+'="'+k+'": ไม่มี key ใน TCC_I18N');
      });
    });
    return errs;
  }

  window.TCC_LANGS=LANGS; window.TCC_LANG_NATIVE=NATIVE;
  window.tccT=tccT; window.tccLang=function(){return cur;};
  window.tccSetLang=tccSetLang; window.tccApplyI18n=tccApplyI18n; window.tccI18nCheck=tccI18nCheck;
  var _e=tccI18nCheck(); if(_e.length&&window.console) console.warn('[TCC i18n] '+_e.length+' รายการผิดพลาด',_e);
})();
</script>

<script>
// ── Config ──
// [FIX] ลบ NOCO token ออกจาก client ทั้งหมด
// ข้อมูลทุกอย่างดึงผ่าน Worker proxy แทน — token อยู่ฝั่ง server เท่านั้น
const WORKER_URL = 'https://information.smpbonus9.workers.dev';
// กระเป๋ารับเงินมาจาก Worker (/api/share/payment) เท่านั้น — ไม่มี address ฝังในหน้าและไม่อ่านจาก localStorage
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const safeImg = u => /^https:\/\/[^\s"'<>]+$/.test(String(u||'')) ? String(u) : '';
const EVM = /^0x[0-9a-fA-F]{40}$/, TXH = /^0x[0-9a-fA-F]{64}$/;
const POLL_MS = 20000;
let _token = '', _pollTimer = null, _lastSig = '';   // (_errState/_lastData อยู่ด้านล่างใกล้ Main)

// ── Field map ──
// v1.3: แถวใน Sheet มี 2 เลย์เอาต์ — (ก) แถวเดิม/legacy: ข้อมูลชิดซ้าย Field 7..Field 13 + โน้ตที่ '50.00%'  (ข) แถวที่ระบบสร้างเอง: ตามหัวคอลัมน์เดิม Field 8/10.00%/.../Field 17
const _PAY_STD={profit:'Field 8',commission:'10.00%',guarantee:'10.00%1',balance:'Field 11',member:'50.00%',central:'50.00%1',transfer:'Field 14',note:'Field 16',txhash:'Field 17'};
const _PAY_LEG={profit:'Field 7',commission:'Field 8',guarantee:'Field 9',balance:'10.00%',member:'10.00%1',central:'Field 11',transfer:'Field 12',note:'50.00%',txhash:'50.00%1'};
function _hasMoney(v){return v!==undefined&&v!==null&&/\d/.test(String(v))&&/^[\s$฿,.\-+\d]+$/.test(String(v));}
function _payLegacy(p){return _hasMoney(p['Field 7'])&&_hasMoney(p['Field 12']);}
function _payStatusOf(p){
  for(const k of ['Field 15','Status','status','Field 13']){
    const l=String(p[k]==null?'':p[k]).replace(/\s+/g,' ').trim().toLowerCase();
    if(!l) continue;
    if(l==='pending'||l.includes('รอ')) return 'Pending';
    if(l==='approve'||l==='approved'||l==='paid'||l.includes('จ่ายแล้ว')||l.includes('อนุมัติ')) return 'Approve';
    if(l==='review') return 'Review';
  }
  return 'Pending';
}
function payVal(p,f){
  const fix={bnb_id:p['Field 1'],name:p['Field 2'],team:p['Field 3'],lva:p['Field 4'],lvb:p['Field 5'],date:p['Field 6']};
  let v;
  if(f==='position') return _payStatusOf(p);
  if(f in fix) v=fix[f];
  else if(f==='note'){ v=p[_payLegacy(p)?_PAY_LEG.note:_PAY_STD.note]; }
  else if(f==='sysnote'){ v=p['Field 16']; }
  else if(f==='txhash'){ v=p['Field 17']; if((v===undefined||v===null||v==='')&&_payLegacy(p)) v=p[_PAY_LEG.txhash]; }
  else v=p[(_payLegacy(p)?_PAY_LEG:_PAY_STD)[f]];
  return(v===undefined||v===null)?'':v;
}
function payNum(p, f) {
  return parseFloat(String(payVal(p, f)).replace(/[$,\s]/g, '')) || 0;
}
function fmtUSD(n) {
  const v = parseFloat(n) || 0;   // v1.5: ติดลบแสดงเป็น -$6.00 (ไม่ใช่ $-6.00)
  return (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// v1.5: แยกรายการเทรด "ครั้งที่1:BTC +$-6.00" → { coin, val, neg } (รองรับ +$-6, -$6, $-6, +$6)
function parseTrade(t) {
  const i = t.indexOf(':');
  const left = (i < 0 ? '' : t.slice(0, i)).replace(/ครั้งที่\s*\d+/g, '').trim();
  const right = (i < 0 ? t : t.slice(i + 1)).trim();
  const m = right.match(/([+\-]?)\s*\$?\s*([+\-]?)\s*\$?\s*(\d[\d,]*(?:\.\d+)?)/);
  if (!m) return { coin: left, raw: right };
  const val = parseFloat(m[3].replace(/,/g, '')) || 0;
  const neg = (m[1] === '-' || m[2] === '-') && val !== 0;
  return { coin: (right.slice(0, m.index).trim() || left), val, neg };
}

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Copy to clipboard ──
function copyAddr(addr) {
  navigator.clipboard.writeText(addr)
    .then(() => showToast('✅ ' + tccT('common.copied')))
    .catch(() => {
      // fallback
      const el = document.createElement('textarea');
      el.value = addr;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      showToast('✅ ' + tccT('common.copied'));
    });
}

// ── ดึงข้อมูลผ่าน share token (Worker ตรวจ HMAC + หมดอายุ + คืนเฉพาะรายการนั้น) ──
async function fetchShare(token) {
  const res = await fetch(`${WORKER_URL}/api/share/payment?t=${encodeURIComponent(token)}`, { cache: 'no-store' });
  if (!res.ok && res.status !== 200) {
    const e = new Error('HTTP ' + res.status); e.http = res.status; throw e;
  }
  return res.json();   // { valid, payment, wallet, exp } | { valid:false, reason }
}

// ── Render ──
// T = tccT + escape HTML (ข้อความจากพจนานุกรมใส่ใน innerHTML ได้อย่างปลอดภัย เช่น "Secured & Encrypted")
const T = (k, v) => esc(tccT(k, v));
const LOCALE = { th:'th-TH', en:'en-GB', vi:'vi-VN', kh:'km-KH', mm:'my-MM', la:'lo-LA', ms:'ms-MY', id:'id-ID', zh:'zh-CN' };
function fmtExp(exp) {
  const d = new Date(exp);
  if (isNaN(d.getTime())) return '';
  try { return d.toLocaleString(LOCALE[tccLang()] || 'en-GB'); } catch (e) { return d.toLocaleString(); }
}

  const warnHTML = (!isReview && /\[auto:sender_mismatch\]/.test(note)) ? `<div class="status-bar" style="border:1px solid rgba(240,185,11,.45);background:rgba(240,185,11,.08);margin-bottom:10px;"><span class="status-text" style="color:var(--gold);font-size:.78rem;line-height:1.5;">${T('pd.senderMismatch')}</span></div>` : '';
  const txHTML = (!isPending && TXH.test(txhash)) ? `
      <div style="margin-top:10px;padding:10px 14px;background:rgba(0,180,255,0.06);border:1px solid rgba(0,180,255,0.2);border-radius:10px;">
        <div style="font-size:0.63rem;color:var(--muted);margin-bottom:4px;letter-spacing:0.5px;">${T('pd.verified')}</div>
        <a href="https://bscscan.com/tx/${esc(txhash)}" target="_blank" rel="noopener noreferrer" title="${T('pd.openBsc')}" style="font-family:monospace;font-size:0.68rem;color:#00b4ff;word-break:break-all;text-decoration:none;">${esc(txhash)}</a>
        <div style="font-size:0.6rem;color:var(--muted);margin-top:4px;">${T('pd.clickBsc')}</div>

  const expHTML = exp ? `<div style="text-align:center;font-size:.62rem;color:var(--muted);margin-top:10px;">${T('ps.expires', { d: fmtExp(exp) })}</div>` : '';

  document.getElementById('payment-container').innerHTML = `

        <div>
          <div class="report-label">${T('pd.report')}</div>
          <div class="live-row">
            <div class="pulse-dot"></div>
            <span class="live-text">${T('pd.live')}</span>
            <span class="live-date">${dateStr}</span>
          </div>
        </div>
      </div>
      <div class="report-no">${T('pd.official', { id: p.Id })}</div>
    </div>

    <!-- Body -->
    <div class="card-body">
      <!-- Member -->
      <div class="member-block">
        <div class="member-avatar">👤</div>
        <div style="flex:1;">
          <div class="member-name">${esc(name)}</div>
          <div class="member-meta">
            <span>🪙 UID: <b>${esc(bnbId)}</b></span>
            <span>🏆 ${esc(team)}</span>
          </div>
          <div class="member-comm">📈 ${T('pd.teamComm')}: <b>${fmtUSD(comm)}</b></div>
        </div>
        <span class="badge ${isPending ? 'badge-pending' : 'badge-approve'}">
          ${T(isPending ? 'pay.status.unpaid' : 'pay.status.paid')}
        </span>
      </div>

      <!-- Level Commission -->
      <div class="level-grid">
        <div class="level-box lva">
          <div class="level-lbl">LEVEL 🅰️: ${esc(lva)||'—'}</div>

        </div>

      <!-- Summary 3 boxes -->
      <div class="summary-grid">
        <div class="summary-box">

      <div class="detail-grid">

// ── Main ──
// สถานะ error เก็บเป็น key + ตัวแปร เพื่อแปลซ้ำได้เมื่อเปลี่ยนภาษา
let _errState = null, _lastData = null;
function renderErr() {
  if (!_errState) return;
  const el = document.getElementById('error-msg');
  el.removeAttribute('data-i18n');          // กันไม่ให้ tccApplyI18n เขียนข้อความเริ่มต้นทับ
  el.textContent = tccT(_errState.k, _errState.v);
}
const showError = (key, vars) => {
  _errState = { k: key, v: vars };
  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('payment-container').style.display = 'none';
  document.getElementById('error-screen').style.display   = 'flex';
  renderErr();
};
const REASONS = {
  expired:   'ps.r.expired',
  not_found: 'ps.r.not_found',
  invalid:   'ps.r.invalid',
};

async function load(first) {
  const d = await fetchShare(_token);
  if (!d.valid) { showError(REASONS[d.reason] || REASONS.invalid); return false; }
  const sig = JSON.stringify([payVal(d.payment,'position'), payVal(d.payment,'txhash'), d.wallet && d.wallet.addr]);
  if (first || sig !== _lastSig) {
    _lastSig = sig;
    _lastData = d;
    document.getElementById('loading-screen').style.display    = 'none';
    document.getElementById('payment-container').style.display = 'block';
    renderPayment(d.payment, d.wallet, d.exp, d.payer);
  }
  // ยังไม่ Approve → ตรวจสถานะซ้ำอัตโนมัติ (ระบบ cron ตรวจ USDT ทุก 2 นาที)
  const st = payVal(d.payment,'position');
  if (st === 'Approve' && _pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
  return true;
}

// เปลี่ยนภาษา → วาดหน้าใหม่ด้วยข้อมูลเดิม (ไม่ต้องดึงจาก Worker ซ้ำ)
document.addEventListener('tcc-lang', () => {
  if (_errState) renderErr();
  else if (_lastData) renderPayment(_lastData.payment, _lastData.wallet, _lastData.exp, _lastData.payer);
});

async function main() {
  const params = new URLSearchParams(window.location.search);
  _token = params.get('pv') || params.get('t') || '';
  if (!_token) {
    showError(params.get('id') ? 'ps.err.legacy' : 'ps.err.notoken');
    return;
  }
  try {
    const ok = await load(true);
    if (ok && _lastSig && !_lastSig.includes('"Approve"')) {
      _pollTimer = setInterval(() => { if (!document.hidden) load(false).catch(() => {}); }, POLL_MS);
    }
  } catch (err) {
    showError('ps.err.generic', { m: err.message });
  }
}

main();
</script>
